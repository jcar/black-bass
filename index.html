<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bass Tour" />
    <meta name="theme-color" content="#0b1d26" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Black Bass Pro Tour</title>
    <style>
      /* Shown until React mounts (asset index + fonts); replaced on first render. */
      html, body { margin: 0; height: 100%; background: #0b1d26; }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; color: #eef6f8;
        font: italic 700 clamp(40px, 9vw, 84px)/0.85 'Arial Narrow', system-ui, sans-serif; letter-spacing: -0.01em; }
      .splash span { display: block; border-bottom: 4px solid #ffd34d; padding-bottom: 8px; animation: sp 1.2s ease-in-out infinite alternate; }
      @keyframes sp { from { opacity: 0.55; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash"><span>BLACK BASS</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
